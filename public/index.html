<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liar’s Bar Lite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bevan&family=Karla:wght@400;700&display=swap">
<style>
:root{--wood:#1d1012;--felt:#3b1519;--felt2:#4a1c21;--brass:#c8a04a;--bone:#efe6d2;--ink:#21161a;--smoke:#a99a8e;--red:#d2553f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--wood);color:var(--bone);font:16px/1.5 Karla,system-ui,sans-serif}
h1,h2,.big{font-family:Bevan,Georgia,serif;font-weight:400;margin:0}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.panel{background:var(--felt);border:2px solid var(--brass);border-radius:6px;padding:20px}
input{font:inherit;padding:10px 12px;border-radius:4px;border:1px solid var(--smoke);background:var(--bone);color:var(--ink);width:100%}
button{font:inherit;font-weight:700;padding:10px 18px;border-radius:4px;border:2px solid var(--brass);background:var(--brass);color:var(--ink);cursor:pointer}
button.ghost{background:transparent;color:var(--brass)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--bone);outline-offset:2px}
.row{display:flex;gap:10px;margin-top:12px}
.err{color:var(--red);min-height:1.5em;margin:8px 0 0}
.title{font-size:2.4rem;line-height:1.1;margin-bottom:6px}
.muted{color:var(--smoke)}
.code{font-family:Bevan,serif;font-size:3rem;letter-spacing:.2em;color:var(--brass)}
ul.names{list-style:none;padding:0;margin:12px 0}
ul.names li{padding:8px 0;border-bottom:1px solid var(--felt2)}
#seats{display:flex;flex-wrap:wrap;gap:10px}
.seat{flex:1 1 150px;background:var(--felt);border:2px solid var(--felt2);border-radius:6px;padding:10px}
.seat.turn{border-color:var(--brass)}
.seat.out{opacity:.4}
.backs{display:flex;gap:3px;margin:6px 0;min-height:22px}
.backs i{width:14px;height:22px;border-radius:2px;background:repeating-linear-gradient(45deg,var(--felt2),var(--felt2) 3px,var(--brass) 3px,var(--brass) 4px)}
.ch{display:flex;gap:5px}
.ch span{width:11px;height:11px;border-radius:50%;border:2px solid var(--smoke)}
.ch span.used{background:var(--smoke)}
.table{margin:14px 0;text-align:center;background:var(--felt);border:2px solid var(--brass);border-radius:6px;padding:22px 12px}
.big{font-size:3rem;color:var(--brass);line-height:1.1}
#hand{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:96px;padding-top:10px}
.card{width:64px;height:90px;border-radius:6px;border:2px solid var(--ink);background:var(--bone);color:var(--ink);font:400 2rem Bevan,serif;padding:0;transition:transform .12s}
.card.joker{background:var(--brass)}
.card.on{transform:translateY(-14px);border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.card.bad{border-color:var(--red);box-shadow:0 0 0 3px var(--red)}
.card.rv{cursor:default;display:inline-flex;align-items:center;justify-content:center;margin:4px;animation:flip .5s both}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
@media (prefers-reduced-motion:reduce){.card.rv{animation:none}.card{transition:none}}
.actions{display:flex;gap:10px;justify-content:center;margin-top:14px}
#overlay{position:fixed;inset:0;background:rgba(20,8,10,.85);display:flex;align-items:center;justify-content:center;padding:16px}
#box{max-width:460px;width:100%;text-align:center}
</style>
</head>
<body>
<div class="wrap">

<section id="home" class="panel">
  <h1 class="title">Liar’s Bar Lite</h1>
  <p class="muted">Bluff your way through the deck. Get caught, and you pull the trigger.</p>
  <label for="name">Your name</label>
  <input id="name" maxlength="14" autocomplete="off">
  <div class="row"><button id="create">Create room</button></div>
  <div class="row">
    <input id="joincode" maxlength="4" placeholder="Room code" autocomplete="off" aria-label="Room code">
    <button id="join" class="ghost">Join</button>
  </div>
  <p class="err" id="err" role="alert"></p>
</section>

<section id="lobby" class="panel" hidden>
  <p class="muted">Room code. Share it with up to 3 friends.</p>
  <div class="code" id="lcode"></div>
  <ul class="names" id="lnames"></ul>
  <button id="start">Start game</button>
  <p class="muted" id="lwait"></p>
</section>

<section id="game" hidden>
  <div id="seats"></div>
  <div class="table">
    <div class="muted">Everyone is claiming to play</div>
    <div class="big" id="tcard"></div>
    <p id="status"></p>
  </div>
  <div id="hand"></div>
  <div class="actions">
    <button id="play">Play selected</button>
    <button id="liar" class="ghost">Call liar</button>
  </div>
  <p class="muted" style="text-align:center">Pick 1 to 3 cards. Jokers count as any card.</p>
</section>

</div>
<div id="overlay" hidden><div class="panel" id="box"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const WORD = { K: 'Kings', Q: 'Queens', A: 'Aces' };
let S = null, sel = new Set();

const label = (c) => (c === 'J' ? '★' : c);
const cardHtml = (c, extra) => `<span class="card rv ${c === 'J' ? 'joker' : ''} ${extra || ''}">${label(c)}</span>`;
const show = (id) => ['home', 'lobby', 'game'].forEach((x) => ($(x).hidden = x !== id));

$('name').value = sessionStorage.getItem('name') || '';
const myName = () => { const n = $('name').value.trim(); sessionStorage.setItem('name', n); return n; };
const fail = (res) => { if (res && res.error) $('err').textContent = res.error; };
$('create').onclick = () => socket.emit('create', myName(), fail);
$('join').onclick = () => socket.emit('join', { code: $('joincode').value, name: myName() }, fail);
$('start').onclick = () => socket.emit('start');
$('play').onclick = () => { socket.emit('play', [...sel]); sel.clear(); };
$('liar').onclick = () => socket.emit('liar');
$('hand').onclick = (e) => {
  const b = e.target.closest('button[data-i]');
  if (!b || !myTurn()) return;
  const i = +b.dataset.i;
  if (sel.has(i)) sel.delete(i); else if (sel.size < 3) sel.add(i);
  render();
};

const myTurn = () => S && S.phase === 'playing' && S.turn === S.youIdx;

socket.on('state', (s) => {
  if (!S || s.phase !== S.phase || s.hand.length !== S.hand.length) sel.clear();
  S = s;
  render();
});

function render() {
  if (!S) return;
  if (S.phase === 'lobby') {
    show('lobby');
    $('lcode').textContent = S.code;
    $('lnames').innerHTML = S.players.map((p, i) => `<li>${esc(p.name)}${i === S.youIdx ? ' (you)' : ''}</li>`).join('');
    $('start').hidden = !S.isHost;
    $('start').disabled = S.players.length < 2;
    $('lwait').textContent = S.isHost ? (S.players.length < 2 ? 'Waiting for at least one more player.' : '') : 'Waiting for the host to start.';
    $('overlay').hidden = true;
    return;
  }
  show('game');
  const P = S.players;
  $('seats').innerHTML = P.map((p, i) => `<div class="seat ${i === S.turn && S.phase === 'playing' ? 'turn' : ''} ${p.alive ? '' : 'out'}">
    <b>${esc(p.name)}${i === S.youIdx ? ' (you)' : ''}</b>
    <div class="backs">${'<i></i>'.repeat(p.cards)}</div>
    <div class="ch" title="Trigger pulls so far">${[0, 1, 2, 3, 4, 5].map((k) => `<span class="${k < p.pulls ? 'used' : ''}"></span>`).join('')}</div>
    <small class="muted">${p.alive ? p.cards + ' cards' : 'Out'}</small></div>`).join('');
  $('tcard').textContent = WORD[S.table] || '';

  let msg = '';
  if (S.phase === 'playing') {
    const who = P[S.turn].name;
    if (myTurn()) msg = S.last ? `${P[S.last.by].name} played ${S.last.count} ${S.last.count === 1 ? 'card' : 'cards'}. Play yours or call liar.` : 'You start. Play 1 to 3 cards face down.';
    else msg = `Waiting for ${who}.`;
  }
  $('status').textContent = msg;

  $('hand').innerHTML = S.hand.map((c, i) => `<button class="card ${c === 'J' ? 'joker' : ''} ${sel.has(i) ? 'on' : ''}" data-i="${i}" aria-pressed="${sel.has(i)}">${label(c)}</button>`).join('');
  $('play').disabled = !(myTurn() && sel.size >= 1 && sel.size <= 3);
  $('liar').disabled = !(myTurn() && S.last);

  const ov = $('overlay'), box = $('box');
  if (S.phase === 'reveal' && S.reveal) {
    const R = S.reveal;
    const cards = R.cards.map((c) => cardHtml(c, c !== S.table && c !== 'J' ? 'bad' : '')).join('');
    box.innerHTML = `<p>${esc(P[R.caller].name)} called ${esc(P[R.accused].name)} a liar.</p>
      <div>${cards}</div>
      <h2>${R.lie ? 'It was a lie.' : 'It was the truth.'}</h2>
      <p>${esc(P[R.spinner].name)} pulls the trigger.</p>
      <h2 style="color:${R.died ? 'var(--red)' : 'var(--brass)'}">${R.died ? 'Bang. Out of the game.' : 'Click. Safe for now.'}</h2>
      <p class="muted">Next round starts in a moment.</p>`;
    ov.hidden = false;
  } else if (S.phase === 'over') {
    const w = P[S.winner];
    box.innerHTML = `<h2>${w ? esc(w.name) + ' wins.' : 'Game over.'}</h2><p class="muted">Last one standing.</p>
      ${S.isHost ? '<button id="again">Play again</button>' : '<p class="muted">Waiting for the host to start another game.</p>'}`;
    ov.hidden = false;
    const a = $('again'); if (a) a.onclick = () => socket.emit('again');
  } else ov.hidden = true;
}
</script>
</body>
</html>
